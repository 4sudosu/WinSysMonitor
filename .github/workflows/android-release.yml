name: Android Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_REPOSITORY: 4sudosu/WinSysMonitor
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        working-directory: Android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          ./gradlew assembleRelease \
            -PversionName="1.1.${GITHUB_RUN_NUMBER}" \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PreleaseStoreFile="$KEYSTORE_FILE" \
            -PreleaseStorePassword="$KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias="$KEY_ALIAS" \
            -PreleaseKeyPassword="$KEY_PASSWORD"

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          version="1.1.${GITHUB_RUN_NUMBER}"
          tag="v${version}"
          apk="Android/app/build/outputs/apk/release/app-release.apk"
          gh release delete "$tag" --repo "$RELEASE_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$tag" "$apk" \
            --repo "$RELEASE_REPOSITORY" \
            --title "WinSysMonitor ${version}" \
            --notes "Android update ${version}." \
            --latest
