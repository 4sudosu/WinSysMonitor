<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WinSysMonitor — Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
  </div>

  <div class="login-wrap">
    <form class="glass login-card" id="loginForm" autocomplete="off">
      <div class="login-lock">🔐</div>
      <div class="login-title">WinSysMonitor</div>
      <div class="login-sub">Enter the owner password to unlock the dashboard.</div>

      <input type="password" id="password" class="login-input" placeholder="Owner password"
             autocomplete="current-password" autofocus>

      <div class="login-error" id="loginError"></div>

      <button type="submit" class="login-btn" id="loginBtn">🔓  Unlock</button>

      <div class="login-foot">Protected access · unauthorized use is not allowed</div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const input = document.getElementById('password');
    const error = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = input.value;
      if (!password) { error.textContent = 'Please enter a password.'; return; }
      btn.disabled = true;
      btn.textContent = 'Unlocking…';
      error.textContent = '';
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (r.status === 403) {
          error.textContent = 'Incorrect password. Try again.';
          input.value = '';
          input.focus();
        } else if (r.ok) {
          location.href = '/';
          return;
        } else {
          error.textContent = 'Something went wrong. Please retry.';
        }
      } catch {
        error.textContent = 'Could not reach the server.';
      }
      btn.disabled = false;
      btn.textContent = '🔓  Unlock';
    });
  </script>
</body>
</html>
