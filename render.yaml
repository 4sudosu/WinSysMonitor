services:
  - type: web
    name: winsys-monitor-server
    runtime: node
    plan: free
    rootDir: Server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: PORT
        value: "10000"

# Alternative: Docker deployment
# 1. Build & push: docker build -t yourusername/winsysmonitor:latest .
# 2. docker push yourusername/winsysmonitor:latest
# 3. In Render: New Web Service → Docker Image → yourusername/winsysmonitor:latest