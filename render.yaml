services:
  - type: web
    name: winsys-monitor-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: PORT
        value: "10000"

# Build Docker image locally and push to Docker Hub:
# docker build -t yourusername/winsysmonitor:latest .
# docker push yourusername/winsysmonitor:latest
# Then update image in Render dashboard or use render.yaml with prebuilt image